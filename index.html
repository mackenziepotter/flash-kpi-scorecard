async function decrypt(pw){
  const p=PAYLOAD,salt=b64d(p.salt),iv=b64d(p.iv),ct=b64d(p.ct),mac=b64d(p.mac);
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);

  if(!(await crypto.subtle.verify('HMAC',macKey,mac,data)))throw new Error('bad password');
