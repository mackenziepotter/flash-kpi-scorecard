  const p=PAYLOAD,salt=b64d(p.salt),iv=b64d(p.iv),ct=b64d(p.ct),mac=b64d(p.mac);
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:p.iter,hash:'SHA-256'},base,512));
  const macKey=await crypto.subtle.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  const data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
  if(!(await crypto.subtle.verify('HMAC',macKey,mac,data)))throw new Error('bad password');
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},key,ct));
}
document.getElementById('f').addEventListener('submit',async(e)=>{
  e.preventDefault();const go=document.getElementById('go'),msg=document.getElementById('msg');
  go.disabled=true;msg.textContent='';
  try{const html=await decrypt(document.getElementById('pw').value);document.open();document.write(html);document.close();}
  catch(err){await new Promise((r)=>setTimeout(r,800));msg.textContent='That password did not work. Please try again.';go.disabled=false;}
});
